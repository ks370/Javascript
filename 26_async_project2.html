<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello everyone how are you?</h1>
    <button id="stop">stop</button>
    <button id="start">start</button>
</body>
<script>
    const saydate=function(){
        console.log("kartik",Date.now());
    }
    let intervalid
   // const intervalid= setInterval(saydate,1000);
   // clearInterval(intervalid) // clearinterval required refernce which u want to stop
    document.querySelector('#start').addEventListener('click',function(e){
        intervalid=setInterval(saydate,1000);
        console.log("started")
    })
    document.querySelector('#stop').addEventListener('click',function(e){
        clearInterval(intervalid)
        console.log("stopped")
    })
</script>
</html>
